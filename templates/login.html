{% extends "base.html" %}

{% block login %}
<div class="login-page">
    <div class="login-card">
        <h2 class="login-brand">Ocean Freight Control</h2>
        <p class="login-subtitle">Enterprise Logistics Authentication</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Secure Login</button>
        </form>
    </div>
</div>
{% endblock %}
